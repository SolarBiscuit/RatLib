modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="icon.png"
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
    config="ratlib.mixins.json"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[5.4,)"
    ordering="NONE"
    side="BOTH"

# Optional Jade — profession line for ProfessionTrader merchants
[[dependencies.${mod_id}]]
    modId="jade"
    mandatory=false
    versionRange="[11.0,)"
    ordering="NONE"
    side="BOTH"
